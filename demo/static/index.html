<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X2StreamingASR Demo</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { max-width: 820px; margin: 0 auto; padding: 2rem; background: #111827; color: #e5e7eb; }
    .card { padding: 1.25rem; margin: 1rem 0; border: 1px solid #374151; border-radius: 12px; background: #1f2937; }
    .row { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; }
    button, select, input { padding: .65rem .8rem; border-radius: 8px; border: 1px solid #4b5563; }
    button { cursor: pointer; background: #2563eb; color: white; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    #transcript { min-height: 5rem; white-space: pre-wrap; font-size: 1.15rem; }
    #status { color: #93c5fd; }
  </style>
</head>
<body>
  <h1>X2StreamingASR</h1>
  <p>Public inference demo for microphone or audio-file transcription.</p>

  <div class="card">
    <div class="row">
      <label>Language
        <select id="language">
          <option value="zh">Chinese</option>
          <option value="en">English</option>
          <option value="cs">Code-switching</option>
        </select>
          </label>
      <button id="record">Start microphone</button>
      <button id="stop" disabled>Stop</button>
      <input id="file" type="file" accept="audio/*">
        </div>
    <p id="status">Connecting…</p>
          </div>

  <div class="card">
    <h2>Transcript</h2>
    <div id="transcript"></div>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const transcriptEl = document.getElementById("transcript");
    const recordBtn = document.getElementById("record");
    const stopBtn = document.getElementById("stop");
    const fileInput = document.getElementById("file");
    const language = document.getElementById("language");
    let ws;
    let audioContext;
    let source;
    let processor;
    let stream;

    function connect() {
      const scheme = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${scheme}://${location.host}/ws`);
      ws.binaryType = "arraybuffer";
      ws.onopen = () => { statusEl.textContent = "Ready"; };
      ws.onclose = () => {
        statusEl.textContent = "Disconnected; reconnecting…";
        setTimeout(connect, 1000);
      };
      ws.onmessage = event => {
        const data = JSON.parse(event.data);
        if (data.type === "partial") {
          transcriptEl.textContent += data.text || "";
        } else if (data.type === "final") {
          transcriptEl.textContent = data.text || data.offline_text || transcriptEl.textContent;
        } else if (data.type === "status") {
          statusEl.textContent = data.message || "Working…";
        }
      };
    }

    function floatToPcm16(input, inputRate) {
      const ratio = inputRate / 16000;
      const length = Math.max(1, Math.floor(input.length / ratio));
      const out = new Int16Array(length);
      for (let i = 0; i < length; i++) {
        const start = Math.floor(i * ratio);
        const end = Math.max(start + 1, Math.floor((i + 1) * ratio));
        let sum = 0;
        for (let j = start; j < Math.min(end, input.length); j++) sum += input[j];
        const sample = Math.max(-1, Math.min(1, sum / (end - start)));
        out[i] = sample < 0 ? sample * 32768 : sample * 32767;
      }
      return out.buffer;
    }

    recordBtn.onclick = async () => {
      transcriptEl.textContent = "";
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioContext = new AudioContext({ sampleRate: 16000 });
      source = audioContext.createMediaStreamSource(stream);
      processor = audioContext.createScriptProcessor(4096, 1, 1);
      processor.onaudioprocess = event => {
        if (ws.readyState === WebSocket.OPEN) {
          ws.send(floatToPcm16(
            event.inputBuffer.getChannelData(0),
            audioContext.sampleRate
          ));
        }
      };
      source.connect(processor);
      processor.connect(audioContext.destination);
      ws.send(JSON.stringify({ type: "start", language: language.value }));
      recordBtn.disabled = true;
      stopBtn.disabled = false;
      statusEl.textContent = "Recording…";
    };

    stopBtn.onclick = async () => {
      processor?.disconnect();
      source?.disconnect();
      stream?.getTracks().forEach(track => track.stop());
      await audioContext?.close();
      ws.send(JSON.stringify({ type: "stop" }));
      recordBtn.disabled = false;
      stopBtn.disabled = true;
      statusEl.textContent = "Finishing…";
    };

    fileInput.onchange = async () => {
      const file = fileInput.files[0];
      if (!file) return;
      transcriptEl.textContent = "";
      statusEl.textContent = "Uploading…";
      const form = new FormData();
      form.append("file", file);
      const response = await fetch("/api/file", { method: "POST", body: form });
      if (!response.ok) {
        statusEl.textContent = `Upload failed: ${response.status}`;
        return;
      }
      const uploaded = await response.json();
      ws.send(JSON.stringify({
        type: "file",
        id: uploaded.id,
        name: uploaded.name,
        language: language.value
      }));
      statusEl.textContent = "Transcribing…";
    };

    connect();
  </script>
</body>
</html>
